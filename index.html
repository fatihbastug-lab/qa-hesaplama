<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verimlilik Takibi Pro - Multi</title>
    <style>
        :root { 
            --primary: #cc0000; --secondary: #2c3e50; --bg: #f4f7f6; 
            --card-bg: #ffffff; --text: #333333; --border: #eeeeee;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Sekme Sistemi */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 900px; }
        .tab-btn { flex: 1; padding: 15px; background: #ddd; border: none; cursor: pointer; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; }

        .panel { display: none; width: 100%; max-width: 900px; }
        .panel.active { display: block; }

        /* Ortak Kart Yapısı */
        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Çoklu Panel Tablo */
        .multi-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr; gap: 8px; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .multi-header { font-weight: bold; font-size: 12px; color: var(--secondary); text-transform: uppercase; border: none; }
        
        input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fafafa; font-size: 13px; box-sizing: border-box; }
        .res-badge { padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; background: #eee; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--secondary); color: white; flex: 2; }
        .btn-copy { background: #27ae60; color: white; flex: 1; }

        .success { background: #27ae60 !important; color: white; }
        .danger { background: #c0392b !important; color: white; }
        
        .info-header { text-align: center; margin-bottom: 15px; font-size: 14px; background: #eef2f3; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('single')">👤 TEKLİ TAKİP</button>
        <button class="tab-btn" onclick="switchTab('multi')">👥 ÇOKLU PANEL (12 KİŞİ)</button>
    </div>

    <div id="single" class="panel active">
        <div class="card" style="max-width: 500px; margin: auto;">
            <h2 style="text-align: center;">Bireysel Analiz</h2>
            <div class="info-header">🕒 08:30 - 18:45 | Hedef: %65</div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold;">ADET</label>
                <input type="number" id="sAdet" placeholder="İşlem Adedi">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold;">ORT. SÜRE (DK)</label>
                <input type="number" id="sSure" placeholder="Dakika">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold;">TOPLANTI (DK)</label>
                <input type="number" id="sToplanti" placeholder="Toplam Toplantı Süresi">
            </div>
            <button class="btn-main" style="width: 100%;" onclick="tekliHesapla()">HESAPLA</button>
            <div id="singleResult" class="res-badge" style="margin-top: 15px; display: none;">%0</div>
        </div>
    </div>

    <div id="multi" class="panel">
        <div class="card">
            <div class="info-header">🚀 Ekip Verimlilik Paneli - İsim Soyisim Bazlı</div>
            
            <div class="multi-grid multi-header">
                <span>İsim Soyisim</span>
                <span>Adet</span>
                <span>Süre</span>
                <span>Toplanti</span>
                <span>Verim</span>
            </div>

            <div id="multiRows">
                </div>

            <div class="btn-group">
                <button class="btn-main" onclick="cokluHesapla()">TÜM EKİBİ ANALİZ ET</button>
                <button class="btn-copy" onclick="cokluKopyala()">RAPORU KOPYALA</button>
            </div>
        </div>
    </div>

<script>
    // 12 Satırı Oluştur
    const multiRows = document.getElementById('multiRows');
    for (let i = 1; i <= 12; i++) {
        multiRows.innerHTML += `
            <div class="multi-grid" id="row-${i}">
                <input type="text" placeholder="İsim Soyisim" class="m-name">
                <input type="number" placeholder="Adet" class="m-adet">
                <input type="number" placeholder="Süre" class="m-sure">
                <input type="number" placeholder="Top." class="m-toplanti">
                <div class="res-badge m-res" id="m-res-${i}">%0</div>
            </div>
        `;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function getGecenMesai() {
        const simdi = new Date();
        const baslangic = new Date();
        baslangic.setHours(8, 30, 0);
        let dk = Math.floor((simdi - baslangic) / 1000 / 60);
        return Math.max(1, Math.min(dk, 615));
    }

    function tekliHesapla() {
        const nA = parseFloat(document.getElementById('sAdet').value) || 0;
        const nS = parseFloat(document.getElementById('sSure').value) || 0;
        const tDk = parseFloat(document.getElementById('sToplanti').value) || 0;
        
        const uretim = (nA * nS) + (nA * 2) + (tDk * 0.70);
        const verim = ((uretim / getGecenMesai()) * 100).toFixed(1);
        
        const res = document.getElementById('singleResult');
        res.style.display = 'block';
        res.innerText = `ANLIK VERİM: %${verim}`;
        res.className = verim >= 65 ? 'res-badge success' : 'res-badge danger';
    }

    function cokluHesapla() {
        const rows = document.querySelectorAll('#multiRows .multi-grid');
        const dk = getGecenMesai();

        rows.forEach(row => {
            const nA = parseFloat(row.querySelector('.m-adet').value) || 0;
            const nS = parseFloat(row.querySelector('.m-sure').value) || 0;
            const tDk = parseFloat(row.querySelector('.m-toplanti').value) || 0;

            const uretim = (nA * nS) + (nA * 2) + (tDk * 0.70);
            const verim = ((uretim / dk) * 100).toFixed(1);

            const badge = row.querySelector('.m-res');
            badge.innerText = `%${verim}`;
            badge.className = verim >= 65 ? 'res-badge m-res success' : (verim > 0 ? 'res-badge m-res danger' : 'res-badge m-res');
        });
    }

    function cokluKopyala() {
        let rapor = "📊 EKİP VERİMLİLİK RAPORU\n------------------------\n";
        document.querySelectorAll('#multiRows .multi-grid').forEach(row => {
            const name = row.querySelector('.m-name').value || "Belirtilmedi";
            const verim = row.querySelector('.m-res').innerText;
            if(verim !== "%0") rapor += `• ${name}: ${verim}\n`;
        });
        navigator.clipboard.writeText(rapor);
        alert("Rapor panoya kopyalandı!");
    }
</script>

</body>
</html>
