<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NET CC | QA Deep Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #ff3b30; --accent: #bc13fe; --bg: #050507; 
            --card-bg: rgba(15, 15, 20, 0.98); --border: rgba(255, 255, 255, 0.08);
        }
        body { 
            font-family: 'Rajdhani', sans-serif; background: var(--bg); color: #fff; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-image: radial-gradient(circle at 0% 0%, #1a0a0a 0%, #050507 50%);
        }
        .container { width: 95%; max-width: 1000px; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        
        /* Sol Kontrol Paneli */
        .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .logo { font-family: 'Orbitron'; font-size: 18px; color: var(--primary); letter-spacing: 3px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; color: #666; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: #fff; font-family: 'Orbitron'; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; background: rgba(255,59,48,0.05); }

        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s; font-weight: 700; margin-top: 10px; }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(255,59,48,0.4); }

        /* Sağ Analiz Dashboard */
        .main-display { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .bento { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; position: relative; }
        .full { grid-column: span 2; }
        
        .val-big { font-family: 'Orbitron'; font-size: 60px; font-weight: 700; line-height: 1; margin: 10px 0; }
        .val-mid { font-family: 'Orbitron'; font-size: 24px; color: var(--accent); }
        .desc { font-size: 11px; color: #555; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

        #intelligence-log { 
            grid-column: span 2; background: rgba(188, 19, 254, 0.03); 
            border: 1px dashed var(--accent); padding: 15px; font-size: 13px; color: #aaa; min-height: 80px;
        }
        .trend-up { color: #00ff00; }
        .trend-down { color: #ff3b30; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <div class="logo">NET CC<br><small style="font-size: 8px;">INTELLIGENCE v3</small></div>
        
        <div class="input-group">
            <label>Normal (Adet | Ort. Sn)</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="nA" placeholder="Adet">
                <input type="number" id="nS" placeholder="Sn">
            </div>
        </div>
        
        <div class="input-group">
            <label>MMA (Adet | Ort. Sn)</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="mA" placeholder="Adet">
                <input type="number" id="mS" placeholder="Sn">
            </div>
        </div>
        
        <div class="input-group">
            <label>Eğitim / Toplantı (Dakika)</label>
            <input type="number" id="tD" placeholder="Toplam dk">
        </div>
        
        <button onclick="deepCalculate()">DERİN ANALİZİ ÇALIŞTIR</button>
    </div>

    <div class="main-display">
        <div class="bento full" style="text-align:center; border-bottom: 3px solid var(--primary);">
            <div class="desc">Gerçek Zamanlı Verimlilik</div>
            <div class="val-big" id="vRatio">%0</div>
            <div id="vStatus" style="font-size: 12px; font-weight: 700;">SİSTEM BEKLEMEDE</div>
        </div>

        <div class="bento">
            <div class="desc">Kalan Mola Bakiyesi</div>
            <div class="val-mid" id="vMola">75 <small style="font-size:10px">dk</small></div>
            <div id="vMolaStatus" style="font-size: 10px; color:#444;">HAKKINIZ VAR</div>
        </div>

        <div class="bento">
            <div class="desc">Gün Sonu Projeksiyonu</div>
            <div class="val-mid" id="vProj">%0</div>
            <div style="font-size: 10px; color:#444;">TAHMİNİ SKOR</div>
        </div>

        <div id="intelligence-log">
            <div class="desc" style="color: var(--accent); margin-bottom: 10px;">🧠 Analitik Çıkarımlar</div>
            <div id="logText">Veri girişi yapıldığında yapay zeka analizi burada görünecektir.</div>
        </div>
    </div>
</div>

<script>
    function deepCalculate() {
        // Girdiler
        const nA = parseFloat(document.getElementById('nA').value) || 0;
        const nS = parseFloat(document.getElementById('nS').value) || 0;
        const mA = parseFloat(document.getElementById('mA').value) || 0;
        const mS = parseFloat(document.getElementById('mS').value) || 0;
        const tD = parseFloat(document.getElementById('tD').value) || 0;

        // Zaman Tanımları
        const simdi = new Date();
        const bas = new Date(); bas.setHours(8, 30, 0);
        const bit = new Date(); bit.setHours(18, 45, 0);
        
        let gecenMesai = (simdi - bas) / 1000 / 60;
        if(gecenMesai < 0) gecenMesai = 0; if(gecenMesai > 615) gecenMesai = 615;
        let kalanMesai = 615 - gecenMesai;

        // Analiz Motoru
        const normalWork = (nA * nS) + (nA * 2);
        const mmaWork = mA * (mS / 2);
        const meetingWork = tD * 0.7;
        const totalValue = normalWork + mmaWork + meetingWork;

        const currentRatio = (totalValue / 540) * 100;
        const netIdle = gecenMesai - totalValue;
        const remainingMola = 75 - netIdle;

        // Projeksiyon (Mevcut hızla giderse ne olur?)
        const workPerMinute = totalValue / gecenMesai;
        const projectedFinal = ((totalValue + (workPerMinute * kalanMesai)) / 540) * 100;

        // UI Güncelleme
        document.getElementById('vRatio').innerText = "%" + currentRatio.toFixed(1);
        document.getElementById('vRatio').style.color = currentRatio >= 65 ? "#00ff00" : "#ff3b30";
        document.getElementById('vMola').innerText = (remainingMola > 0 ? remainingMola.toFixed(0) : 0) + " dk";
        document.getElementById('vProj').innerText = "%" + (projectedFinal > 0 ? projectedFinal.toFixed(1) : 0);

        // Derin Log Algoritması
        let logs = [];
        if(currentRatio < 65) {
            const missing = (540 * 0.65) - totalValue;
            const needed = Math.ceil(missing / (nS + 2 || 10));
            logs.push(`⚠️ <span class="trend-down">HEDEF ALTI:</span> %65 eşiği için <span style="color:white">${needed} adet</span> daha normal çağrı analizi gerekli.`);
        } else {
            logs.push(`✅ <span class="trend-up">HEDEF UYUMLU:</span> Mevcut tempoda mesai sonunda %${projectedFinal.toFixed(1)} skora ulaşacaksınız.`);
        }

        if(remainingMola < 0) {
            logs.push(`🚨 <span class="trend-down">MOLA İHLALİ:</span> Tanımlı mola süresini ${Math.abs(remainingMola).toFixed(0)} dakika aştınız.`);
        } else if(remainingMola < 15) {
            logs.push(`🟡 <span style="color:orange">DİKKAT:</span> Mola bakiyeniz tükenmek üzere (${remainingMola.toFixed(0)} dk kaldı).`);
        }

        if(nA > 0 && nS > 15) {
            logs.push(`🐢 <span style="color:cyan">HIZ ANALİZİ:</span> Analiz süreniz ortalamanın üzerinde, biraz daha seri olabilirsiniz.`);
        }

        document.getElementById('logText').innerHTML = logs.map(l => `<div style="margin-bottom:8px;">• ${l}</div>`).join('');
        document.getElementById('vStatus').innerText = currentRatio >= 65 ? "OPTIMAL PERFORMANCE" : "ACTION REQUIRED";
        document.getElementById('vStatus').style.color = currentRatio >= 65 ? "#00ff00" : "#ff3b30";
    }
</script>

</body>
</html>
