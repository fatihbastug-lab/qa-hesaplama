<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NET CC | Hybrid Intelligence Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #FF3B30; --bg: #050505; --glass: rgba(255, 255, 255, 0.03);
            --glass-heavy: rgba(20, 20, 22, 0.9); --border: rgba(255, 255, 255, 0.1);
            --accent-green: #30D158; --accent-blue: #0A84FF;
        }
        body {
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white;
            min-height: 100vh; background-image: radial-gradient(circle at top right, #2c0a0a 0%, #050505 60%);
            display: flex; justify-content: center; padding: 40px 20px;
        }
        .container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 400px 1fr; gap: 24px; }
        
        /* Sol Panel: Girişler */
        .side-panel { background: var(--glass-heavy); backdrop-filter: blur(40px); border: 1px solid var(--border); border-radius: 40px; padding: 35px; display: flex; flex-direction: column; gap: 20px; }
        .tab-menu { display: flex; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 15px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 12px; background: transparent; color: #666; cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; }

        .input-section { display: none; animation: fadeIn 0.4s ease; }
        .input-section.active { display: block; }
        
        label { display: block; font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        input, select { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 14px; border-radius: 14px; color: white; outline: none; margin-bottom: 15px; box-sizing: border-box; }
        input:focus { border-color: var(--primary); }

        .calc-btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(255,59,48,0.2); }
        .calc-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(255,59,48,0.4); }

        /* Sağ Panel: Dashboard */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bento { background: var(--glass-heavy); border: 1px solid var(--border); border-radius: 35px; padding: 30px; }
        .hero { grid-column: span 2; text-align: center; }
        .big-val { font-size: 90px; font-weight: 800; letter-spacing: -5px; margin: 10px 0; }
        .stat-num { font-size: 32px; font-weight: 700; display: block; }
        .label-sm { font-size: 11px; color: #555; font-weight: 700; text-transform: uppercase; }

        .drop-zone { border: 2px dashed var(--border); padding: 30px; border-radius: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="side-panel">
        <div style="text-align: center; margin-bottom: 10px;">
            <img src="netcc.png" alt="Logo" style="height: 30px;">
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('manuel')">MANUEL HESAP</button>
            <button class="tab-btn" onclick="switchTab('otomatik')">DOSYA ANALİZİ</button>
        </div>

        <div id="manuelArea" class="input-section active">
            <label>Normal Dinleme</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="mnA" placeholder="Adet">
                <input type="number" id="mnS" placeholder="Ort. Sn">
            </div>
            <label>MMA Dinleme</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="mmA" placeholder="Adet">
                <input type="number" id="mmS" placeholder="Ort. Sn">
            </div>
            <label>Toplantı (Dk)</label>
            <input type="number" id="mtD" placeholder="Dk">
            <button class="calc-btn" onclick="calculateManuel()">HESAPLA</button>
        </div>

        <div id="otomatikArea" class="input-section">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <span style="font-size: 24px;">📁</span>
                <p style="font-size: 11px; color: #666;">Dosyayı buraya bırakın</p>
                <input type="file" id="fileInput" hidden accept=".xlsx, .xls, .csv">
            </div>
            <label>Kişi Seçimi</label>
            <select id="userSel" onchange="updateDates()"><option value="">Önce dosya yükleyin</option></select>
            <label>Tarih Seçimi</label>
            <select id="dateSel"><option value="">Kişi seçin</option></select>
            <button class="calc-btn" onclick="calculateAuto()" style="background: var(--accent-blue);">DOSYADAN ANALİZ ET</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="bento hero">
            <div id="resTitle" class="label-sm">PERFORMANS ENDEKSİ</div>
            <div class="big-val" id="rRatio">%0</div>
            <div id="rAdvice" style="color: #666; font-size: 13px;">Analiz başlatılması bekleniyor...</div>
        </div>
        <div class="bento">
            <span class="label-sm">Toplam Çağrı</span>
            <span class="stat-num" id="rCount">0</span>
        </div>
        <div class="bento">
            <span class="label-sm">Net Çalışma (Dk)</span>
            <span class="stat-num" id="rWork">0</span>
        </div>
        <div class="bento" style="grid-column: span 2; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <span class="label-sm">Boşta Kalan Süre</span>
                <span class="stat-num" id="rIdle" style="color: var(--accent-green);">0 dk</span>
            </div>
            <button onclick="copyRep()" style="background: white; color: black; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 800; cursor: pointer;">KOPYALA</button>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.input-section').forEach(s => s.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tab + 'Area').classList.add('active');
    }

    // MANUEL HESAPLAMA
    function calculateManuel() {
        const nA = parseFloat(document.getElementById('mnA').value) || 0;
        const nS = parseFloat(document.getElementById('mnS').value) || 0;
        const mA = parseFloat(document.getElementById('mmA').value) || 0;
        const mS = parseFloat(document.getElementById('mmS').value) || 0;
        const tD = parseFloat(document.getElementById('mtD').value) || 0;

        const work = (nA * nS) + (nA * 2) + (mA * (mS / 2)) + (tD * 0.7);
        updateUI(work, nA + mA, "MANUEL ANALİZ");
    }

    // DOSYA İŞLEMLERİ
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            const users = [...new Set(rawData.map(i => i["Dinleyen"]))].filter(Boolean);
            const uSel = document.getElementById('userSel');
            uSel.innerHTML = '<option value="">Kişi Seçin</option>' + users.map(u => `<option value="${u}">${u}</option>`).join('');
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function updateDates() {
        const user = document.getElementById('userSel').value;
        const dates = [...new Set(rawData.filter(i => i["Dinleyen"] === user).map(i => i["Yeni Kayıt Tarihi"]))].filter(Boolean);
        document.getElementById('dateSel').innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
    }

    function calculateAuto() {
        const user = document.getElementById('userSel').value;
        const date = document.getElementById('dateSel').value;
        const filtered = rawData.filter(i => i["Dinleyen"] === user && i["Yeni Kayıt Tarihi"] === date);

        let work = 0;
        filtered.forEach(i => {
            let s = String(i["Süre"] || "0");
            let m = s.includes(":") ? (parseInt(s.split(":")[0]) + parseInt(s.split(":")[1])/60) : parseFloat(s);
            work += (m + 2);
        });
        updateUI(work, filtered.length, `${user} | ${date}`);
    }

    function updateUI(work, count, title) {
        const now = new Date();
        const start = new Date(); start.setHours(8, 30, 0);
        let elapsed = Math.floor((now - start) / 1000 / 60);
        if(elapsed < 0) elapsed = 0; if(elapsed > 615) elapsed = 615;

        const ratio = (work / 540) * 100;
        document.getElementById('rRatio').innerText = "%" + ratio.toFixed(1);
        document.getElementById('rRatio').style.color = ratio >= 65 ? "var(--accent-green)" : "var(--primary)";
        document.getElementById('rCount').innerText = count;
        document.getElementById('rWork').innerText = work.toFixed(0);
        document.getElementById('rIdle').innerText = (elapsed - work > 0 ? (elapsed - work).toFixed(0) : 0) + " dk";
        document.getElementById('resTitle').innerText = title;
    }

    function copyRep() {
        const text = `📊 QA RAPORU\nSonuç: ${document.getElementById('rRatio').innerText}\nÇalışma: ${document.getElementById('rWork').innerText} dk\n#NetCC`;
        navigator.clipboard.writeText(text); alert("Kopyalandı!");
    }
</script>
</body>
</html>
