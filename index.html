<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verimlilik Takibi Pro - Final</title>
    <style>
        :root { --primary: #cc0000; --secondary: #2c3e50; --bg: #f4f7f6; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .info-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 1200px; margin-bottom: 15px; font-size: 13px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; width: 100%; max-width: 1200px; }
        .tab-btn { flex: 1; padding: 12px; background: #ddd; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        .panel { display: none; width: 100%; max-width: 1200px; }
        .panel.active { display: block; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .multi-grid { display: grid; grid-template-columns: 1.5fr 0.6fr 0.6fr 0.6fr 0.6fr 0.6fr 0.8fr 1.2fr; gap: 5px; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .multi-header { font-weight: bold; font-size: 10px; text-align: center; background: #ececec; border-radius: 5px; padding: 10px; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 12px; text-align: center; }
        .res-badge { padding: 8px; border-radius: 5px; text-align: center; font-weight: bold; background: #eee; font-size: 12px; }
        .success { background: #27ae60 !important; color: white; }
        .danger { background: #c0392b !important; color: white; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--secondary); color: white; flex: 2; }
        .btn-excel { background: #1f7244; color: white; flex: 1; }
        .btn-share { background: #3498db; color: white; flex: 1; }
        .m-detay { font-size: 10px; color: #666; text-align: center; }
    </style>
</head>
<body>

    <div class="info-bar">
        <div>🕒 Mesai: <b>08:30 - 18:45</b></div>
        <div>☕ Toplam: <b>615 dk</b></div>
        <div>🤝 Topl. Verimi: <b>%70</b></div>
        <div>🎯 Hedef Verim: <b>%65</b></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('single')">👤 TEKLİ TAKİP</button>
        <button class="tab-btn" onclick="switchTab('multi')">👥 EKİP PANELİ</button>
    </div>

    <div id="single" class="panel active">
        <div class="card" style="max-width: 500px; margin: auto;">
            <select id="sPersonel" style="margin-bottom:10px;"></select>
            <input type="number" id="sAdet" placeholder="Normal Adet" style="margin-bottom:5px;">
            <input type="number" id="sSure" placeholder="Normal Süre" style="margin-bottom:5px;">
            <input type="number" id="sEkAdet" placeholder="Ek İşlem Adet" style="margin-bottom:5px;">
            <input type="number" id="sEkSure" placeholder="Ek İşlem Süre" style="margin-bottom:5px;">
            <input type="number" id="sToplanti" placeholder="Toplantı (dk)">
            <button class="btn-main" style="width:100%; margin-top:15px;" onclick="tekliHesapla()">HESAPLA</button>
            <div id="sFullResult" style="display:none; margin-top:15px; text-align: center;">
                <div id="sBadge" class="res-badge" style="font-size: 18px; padding: 15px;">%0</div>
                <div class="btn-group">
                    <button class="btn-excel" onclick="tekliExcelIndir()">📊 EXCEL</button>
                    <button class="btn-share" onclick="tekliPaylas()">📤 PAYLAŞ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="multi" class="panel">
        <div class="card">
            <div class="multi-grid multi-header">
                <span>Personel</span><span>N.A</span><span>N.S</span><span>E.A</span><span>E.S</span><span>Top.</span><span>Verim</span><span>Analiz</span>
            </div>
            <div id="multiRows"></div>
            <div class="btn-group">
                <button class="btn-main" onclick="cokluHesapla()">EKİBİ ANALİZ ET</button>
                <button class="btn-excel" onclick="cokluExcelIndir()">📊 EXCEL İNDİR</button>
                <button class="btn-share" onclick="cokluPaylas()">📤 PAYLAŞ</button>
            </div>
        </div>
    </div>

<script>
    const isimler = ["DOGA SUMEYYE SAFAK", "OZLEM BASCAVUSOGULLARI", "FATIH KARADENIZ", "HALIDE PALAVAR", "FATIH BASTUG", "HABIBE KARABIYIK", "GOKSU DANACI", "RUKIYE DEMIRKALE", "YALIN BASBUG", "MUNEVVER YILMAZ", "BERFIN SULTAN DAGLI", "DİĞER"];

    function init() {
        const sSel = document.getElementById('sPersonel');
        const mRows = document.getElementById('multiRows');
        isimler.forEach(n => sSel.innerHTML += `<option value="${n}">${n}</option>`);
        for (let i = 0; i < 12; i++) {
            let opts = isimler.map((n, idx) => `<option value="${n}" ${i===idx ? 'selected' : ''}>${n}</option>`).join('');
            mRows.innerHTML += `
                <div class="multi-grid">
                    <select class="m-name">${opts}</select>
                    <input type="number" class="m-adet" value="0">
                    <input type="number" class="m-sure" value="0">
                    <input type="number" class="m-ek-adet" value="0">
                    <input type="number" class="m-ek-sure" value="0">
                    <input type="number" class="m-toplanti" value="0">
                    <div class="res-badge m-res">%0</div>
                    <div class="m-detay">-</div>
                </div>`;
        }
    }

    function switchTab(t) {
        document.querySelectorAll('.panel, .tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(t).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function hesapDetay(nA, nS, eA, eS, tDk) {
        const simdi = new Date();
        const bas = new Date(); bas.setHours(8, 30, 0);
        let gecen = Math.floor((simdi - bas) / 60000);
        gecen = Math.max(1, Math.min(gecen, 615));
        const uretim = (nA * nS) + (nA * 2) + (eA * (eS * 0.5)) + (tDk * 0.7);
        const verim = ((uretim / gecen) * 100).toFixed(1);
        return { verim, uretim: uretim.toFixed(0) };
    }

    function tekliHesapla() {
        const d = hesapDetay(
            parseFloat(document.getElementById('sAdet').value)||0, parseFloat(document.getElementById('sSure').value)||0,
            parseFloat(document.getElementById('sEkAdet').value)||0, parseFloat(document.getElementById('sEkSure').value)||0,
            parseFloat(document.getElementById('sToplanti').value)||0
        );
        document.getElementById('sFullResult').style.display = 'block';
        const b = document.getElementById('sBadge');
        b.innerText = `%${d.verim} VERİMLİLİK`;
        b.className = d.verim >= 65 ? 'res-badge success' : 'res-badge danger';
    }

    function cokluHesapla() {
        document.querySelectorAll('#multiRows .multi-grid').forEach(row => {
            const d = hesapDetay(
                parseFloat(row.querySelector('.m-adet').value)||0, parseFloat(row.querySelector('.m-sure').value)||0,
                parseFloat(row.querySelector('.m-ek-adet').value)||0, parseFloat(row.querySelector('.m-ek-sure').value)||0,
                parseFloat(row.querySelector('.m-toplanti').value)||0
            );
            const badge = row.querySelector('.m-res');
            badge.innerText = `%${d.verim}`;
            badge.className = d.verim >= 65 ? 'res-badge success' : (d.verim > 0 ? 'res-badge danger' : 'res-badge');
            row.querySelector('.m-detay').innerText = `Üretilen: ${d.uretim} dk`;
        });
    }

    // GÜÇLÜ EXCEL İNDİRME (Unicode/UTF-8)
    function excelIndir(filename, tableHtml) {
        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:x='urn:schemas-microsoft-com:office:excel' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='UTF-8'></head><body>";
        const footer = "</body></html>";
        const blob = new Blob([header + tableHtml + footer], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
    }

    function cokluExcelIndir() {
        let table = "<table border='1'><tr><th>Personel</th><th>Verimlilik</th><th>Detay</th></tr>";
        document.querySelectorAll('#multiRows .multi-grid').forEach(row => {
            const v = row.querySelector('.m-res').innerText;
            if(v !== "%0") {
                table += `<tr><td>${row.querySelector('.m-name').value}</td><td>${v}</td><td>${row.querySelector('.m-detay').innerText}</td></tr>`;
            }
        });
        table += "</table>";
        excelIndir("Ekip_Raporu.xls", table);
    }

    function tekliExcelIndir() {
        const isim = document.getElementById('sPersonel').value;
        const verim = document.getElementById('sBadge').innerText;
        let table = `<table border='1'><tr><th>Personel</th><th>Verim</th></tr><tr><td>${isim}</td><td>${verim}</td></tr></table>`;
        excelIndir("Tekli_Rapor.xls", table);
    }

    // PAYLAŞMA FONKSİYONU
    async function paylasimYap(metin) {
        if (navigator.share) {
            try { await navigator.share({ title: 'Rapor', text: metin }); } catch {}
        } else {
            navigator.clipboard.writeText(metin);
            alert("Rapor kopyalandı!");
        }
    }

    function cokluPaylas() {
        let t = "📊 EKİP RAPORU\n";
        document.querySelectorAll('#multiRows .multi-grid').forEach(row => {
            const v = row.querySelector('.m-res').innerText;
            if(v !== "%0") t += `• ${row.querySelector('.m-name').value}: ${v}\n`;
        });
        paylasimYap(t);
    }

    function tekliPaylas() {
        const t = `📊 RAPOR\nPersonel: ${document.getElementById('sPersonel').value}\nVerim: ${document.getElementById('sBadge').innerText}`;
        paylasimYap(t);
    }

    init();
</script>
</body>
</html>
