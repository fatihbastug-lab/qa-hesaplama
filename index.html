<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NET CC | QA Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF3B30; /* Dinamik Kırmızı */
            --bg: #08080A;
            --surface: #121217;
            --border: rgba(255, 255, 255, 0.08);
            --text-dim: #88888E;
            --accent-green: #30D158;
            --accent-blue: #0A84FF;
        }

        body {
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg); color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #2c1212 0%, #08080a 70%);
        }

        .command-center {
            width: 100%; max-width: 1000px;
            display: grid; grid-template-columns: 360px 1fr; gap: 20px;
        }

        /* Sol Panel - Giriş Kontrolleri */
        .glass-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 32px; padding: 35px;
            display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .brand img { height: 35px; margin-bottom: 5px; }
        .brand h1 { font-size: 14px; color: var(--text-dim); margin: 0; font-weight: 400; letter-spacing: 1px; }

        .input-box { margin-bottom: 5px; }
        label { display: block; font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        
        .row { display: flex; gap: 12px; }
        input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; color: white; font-family: inherit;
            font-size: 15px; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: rgba(255,255,255,0.06); }

        .btn-run {
            width: 100%; padding: 20px; background: var(--primary); color: white;
            border: none; border-radius: 20px; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.4s; margin-top: 15px;
            box-shadow: 0 15px 30px rgba(255,59,48,0.3);
        }
        .btn-run:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(255,59,48,0.5); }

        /* Sağ Panel - Veri Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .bento {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 28px; padding: 25px; transition: 0.3s;
        }

        .hero { grid-column: span 2; text-align: center; padding: 40px; position: relative; overflow: hidden; }
        .hero::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--primary); opacity: 0.5; }

        .big-val { font-size: 90px; font-weight: 800; letter-spacing: -5px; margin: 10px 0; line-height: 0.9; transition: 0.5s; }
        .lbl-sm { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        .stat-grid { grid-column: span 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .mini-card { padding: 20px; border-radius: 22px; }
        .mini-val { font-size: 24px; font-weight: 700; display: block; margin-top: 5px; }

        .footer-info {
            grid-column: span 2; background: rgba(255,255,255,0.02);
            border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .live-dot { height: 8px; width: 8px; background: var(--accent-green); border-radius: 50%; display: inline-block; margin-right: 8px; animation: pulse 2s infinite; }
    </style>
</head>
<body>

<div class="command-center">
    <div class="glass-panel">
        <div class="brand">
            <img src="netcc.png" alt="NET CC">
            <h1>QA PERFORMANCE ANALYTICS</h1>
        </div>

        <div class="input-box">
            <label>Normal Çağrı Dinleme</label>
            <div class="row">
                <input type="number" id="nA" placeholder="Adet">
                <input type="number" id="nS" placeholder="Ort. Süre">
            </div>
        </div>

        <div class="input-box">
            <label>MMA (Süre / 2)</label>
            <div class="row">
                <input type="number" id="mA" placeholder="Adet">
                <input type="number" id="mS" placeholder="Ort. Süre">
            </div>
        </div>

        <div class="input-box">
            <label>Toplantı & Eğitim (Dakika)</label>
            <input type="number" id="tD" placeholder="Toplam toplantı süresi">
        </div>

        <button class="btn-run" onclick="analyze()">ANALİZİ ÇALIŞTIR</button>
    </div>

    <div class="dashboard">
        <div class="bento hero">
            <div class="lbl-sm"><span class="live-dot"></span>ANLIK VERİMLİLİK ENDEKSİ</div>
            <div class="big-val" id="resRatio">%0</div>
            <div id="statusTxt" style="font-size: 14px; font-weight: 600; color: #555;">Veri Girişi Bekleniyor</div>
        </div>

        <div class="stat-grid">
            <div class="bento mini-card">
                <div class="lbl-sm">Aktif Çalışma</div>
                <span class="mini-val" id="resWork">0 <small style="font-size: 12px; color:#444;">dk</small></span>
            </div>
            <div class="bento mini-card">
                <div class="lbl-sm">Mola + Boşta</div>
                <span class="mini-val" id="resIdle" style="color: var(--accent-blue);">0 <small style="font-size: 12px; color:#444;">dk</small></span>
            </div>
            <div class="bento mini-card">
                <div class="lbl-sm">Kalan Mesai</div>
                <span class="mini-val" id="resRem">0 <small style="font-size: 12px; color:#444;">dk</small></span>
            </div>
        </div>

        <div class="bento" style="grid-column: span 2;">
            <div class="lbl-sm" style="margin-bottom: 15px;">🔍 Profesyonel Tahmin & Öneri</div>
            <div id="advice" style="font-size: 14px; line-height: 1.6; color: #aaa;">
                Verileri girdikten sonra yapay zeka destekli performans önerileriniz burada görünecektir.
            </div>
        </div>

        <div class="footer-info">
            <div style="font-size: 11px; color: #444; font-weight: 700;">MESAI: 08:30 - 18:45 | BASE: 540 DK</div>
            <button onclick="copyRep()" style="background: white; color: black; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 12px;">RAPORU KOPYALA</button>
        </div>
    </div>
</div>

<script>
    function analyze() {
        const nA = parseFloat(document.getElementById('nA').value) || 0;
        const nS = parseFloat(document.getElementById('nS').value) || 0;
        const mA = parseFloat(document.getElementById('mA').value) || 0;
        const mS = parseFloat(document.getElementById('mS').value) || 0;
        const tD = parseFloat(document.getElementById('tD').value) || 0;

        // Zaman Motoru
        const now = new Date();
        const start = new Date(); start.setHours(8, 30, 0);
        const end = new Date(); end.setHours(18, 45, 0);

        let elapsed = Math.floor((now - start) / 1000 / 60);
        if (elapsed < 0) elapsed = 0; if (elapsed > 615) elapsed = 615;

        let remaining = Math.floor((end - now) / 1000 / 60);
        if (remaining < 0) remaining = 0;

        // Hesaplama Mantığı
        const workMinutes = (nA * nS) + (nA * 2) + (mA * (mS / 2)) + (tD * 0.7);
        const ratio = (workMinutes / 540) * 100;
        const idle = elapsed - workMinutes;

        // UI Güncelleme
        const rRatio = document.getElementById('resRatio');
        rRatio.innerText = "%" + ratio.toFixed(1);
        rRatio.style.color = ratio >= 65 ? "var(--accent-green)" : "var(--primary)";

        document.getElementById('resWork').innerHTML = workMinutes.toFixed(0) + ' <small style="font-size: 12px; color:#444;">dk</small>';
        document.getElementById('resIdle').innerHTML = (idle > 0 ? idle.toFixed(0) : 0) + ' <small style="font-size: 12px; color:#444;">dk</small>';
        document.getElementById('resRem').innerHTML = remaining + ' <small style="font-size: 12px; color:#444;">dk</small>';

        const statusTxt = document.getElementById('statusTxt');
        const advice = document.getElementById('advice');

        if(ratio >= 65) {
            statusTxt.innerText = "HEDEF UYUMLU PERFORMANCE";
            statusTxt.style.color = "var(--accent-green)";
            advice.innerText = `Harika! Şu anki verimliliğin %65 barajının üzerinde. Gün sonuna kadar bu tempoyu koruman yeterli olacaktır. Boşta geçen ${idle.toFixed(0)} dakikanın ${idle > 75 ? 'bir kısmı mola dışı kalmış görünüyor.' : 'tamamı mola sınırları içinde.'}`;
        } else {
            statusTxt.innerText = "KRİTİK VERİMLİLİK DÜZEYİ";
            statusTxt.style.color = "var(--primary)";
            const missingWork = (540 * 0.65) - workMinutes;
            const neededCalls = Math.ceil(missingWork / (nS + 2 || 8));
            advice.innerText = `Hedefin gerisindesin. %65 barajına ulaşmak için yaklaşık ${neededCalls} adet daha normal çağrı analizi yapman gerekiyor. Kalan ${remaining} dakikayı verimli kullanmalısın.`;
        }
    }

    function copyRep() {
        const ratio = document.getElementById('resRatio').innerText;
        const text = `📊 QA PERFORMANS ÖZETİ\n----------------------\nVerimlilik: ${ratio}\nAktif Çalışma: ${document.getElementById('resWork').innerText.split(' ')[0]} dk\nKalan Mesai: ${document.getElementById('resRem').innerText.split(' ')[0]} dk\n----------------------\n#NetCC #Performance`;
        navigator.clipboard.writeText(text);
        alert("Profesyonel rapor panoya kopyalandı!");
    }
</script>

</body>
</html>
