<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NET Call Center | Zaman & Verimlilik Analizi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .logo-container img { max-width: 140px; margin-bottom: 10px; }
        h2 { color: #333; font-size: 20px; margin-bottom: 5px; }
        .shift-info { font-size: 12px; color: #777; margin-bottom: 20px; }
        
        .section { background: #f8f9fa; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: left; border-left: 5px solid #cc0000; }
        label { display: block; font-size: 11px; color: #666; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1a252f; }

        .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; display: none; }
        .analysis-item { padding: 15px; border-radius: 10px; color: white; }
        .bg-blue { background: #2980b9; }
        .bg-orange { background: #e67e22; }
        .bg-green { background: #27ae60; }
        .bg-red { background: #c0392b; }
        
        .stat-val { font-size: 20px; font-weight: bold; display: block; }
        .stat-lbl { font-size: 11px; opacity: 0.9; }

        #targetMessage { margin-top: 15px; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container"><img src="logo.png" alt="Logo"></div>
    <h2>QA Performans & Zaman Analizi</h2>
    <div class="shift-info">Mesai Başlangıcı: 08:30 | Hedef: %65</div>

    <div class="section">
        <label>NORMAL DİNLEME</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="nAdet" placeholder="Adet">
            <input type="number" id="nSure" placeholder="Ort. Süre">
        </div>
    </div>

    <div class="section" style="border-left-color: #2980b9;">
        <label>MMA DİNLEME</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="mAdet" placeholder="Adet">
            <input type="number" id="mSure" placeholder="Ort. Süre">
        </div>
    </div>

    <button onclick="analizEt()">ANALİZİ ÇALIŞTIR</button>

    <div id="analysisGrid" class="analysis-grid">
        <div class="analysis-item bg-blue">
            <span id="gecenSure" class="stat-val">0</span>
            <span class="stat-lbl">Toplam Mesai (dk)</span>
        </div>
        <div class="analysis-item bg-green">
            <span id="dinlemeSure" class="stat-val">0</span>
            <span class="stat-lbl">Dinleme Toplam (dk)</span>
        </div>
        <div class="analysis-item bg-orange">
            <span id="bosSure" class="stat-val">0</span>
            <span class="stat-lbl">Boşta Geçen (dk)</span>
        </div>
        <div class="analysis-item bg-red">
            <span id="verimSkor" class="stat-val">%0</span>
            <span class="stat-lbl">Genel Verimlilik</span>
        </div>
    </div>

    <div id="targetMessage"></div>
</div>

<script>
    function analizEt() {
        const nA = parseFloat(document.getElementById('nAdet').value) || 0;
        const nS = parseFloat(document.getElementById('nSure').value) || 0;
        const mA = parseFloat(document.getElementById('mAdet').value) || 0;
        const mS = parseFloat(document.getElementById('mSure').value) || 0;

        // 1. Zaman Hesaplama (08:30'dan şu ana)
        const simdi = new Date();
        const baslangic = new Date();
        baslangic.setHours(8, 30, 0);

        let farkDakika = Math.floor((simdi - baslangic) / 1000 / 60);
        if (farkDakika < 0) farkDakika = 0; // Eğer saat 08:30'dan önceyse
        if (farkDakika > 540) farkDakika = 540; // Maksimum mesai 540 dk

        // 2. İş Yükü Hesaplama
        const dinlemeDk = (nA * nS + nA * 2) + (mA * (mS / 2));
        const bosDk = farkDakika - dinlemeDk;
        const verimlilik = (dinlemeDk / 540) * 100;

        // 3. UI Güncelleme
        document.getElementById('analysisGrid').style.display = 'grid';
        document.getElementById('gecenSure').innerText = farkDakika;
        document.getElementById('dinlemeSure').innerText = dinlemeDk.toFixed(0);
        document.getElementById('bosSure').innerText = bosDk > 0 ? bosDk.toFixed(0) : 0;
        document.getElementById('verimSkor').innerText = "%" + verimlilik.toFixed(1);

        const msg = document.getElementById('targetMessage');
        msg.style.display = 'block';

        if (verimlilik >= 65) {
            msg.style.background = "#e8f5e9";
            msg.style.color = "#2e7d32";
            msg.innerText = "TEBRİKLER: Hedefin üzerindesin! ✅";
        } else {
            msg.style.background = "#ffebee";
            msg.style.color = "#c62828";
            msg.innerText = "UYARI: %65 hedefinin altındasın. Hızlanmalısın! ⚠️";
        }
    }
</script>

</body>
</html>
