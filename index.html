<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NET CC | QA Dashboard Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff3b30;
            --accent: #bc13fe; /* Neon Mor */
            --bg: #050507;
            --card-bg: rgba(15, 15, 20, 0.8);
            --glow: 0 0 15px rgba(255, 59, 48, 0.4);
            --border: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 59, 48, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(188, 19, 254, 0.05) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
        }

        /* Giriş Paneli - Sol */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary);
        }

        .header img { height: 35px; margin-bottom: 10px; }
        .header h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 14px; 
            letter-spacing: 2px; color: var(--primary); margin: 0; text-transform: uppercase;
        }

        .input-group { margin-top: 25px; }
        label { 
            display: block; font-size: 11px; font-weight: 700; color: #888; 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
        }

        .row { display: flex; gap: 10px; }
        input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; color: #fff; font-family: 'Rajdhani';
            font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: var(--glow); }

        .btn-calculate {
            width: 100%; padding: 15px; background: var(--primary); color: #fff;
            border: none; border-radius: 10px; font-family: 'Orbitron'; font-size: 12px;
            font-weight: 700; cursor: pointer; margin-top: 20px; transition: 0.3s;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        .btn-calculate:hover { background: #ff4d4d; transform: scale(1.02); box-shadow: var(--glow); }

        /* Dashboard - Sağ */
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 15px; padding: 25px; position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card.hero { grid-column: span 2; text-align: center; border: 1px solid rgba(255, 59, 48, 0.2); }

        .val-large { 
            font-family: 'Orbitron', sans-serif; font-size: 70px; font-weight: 700; 
            margin: 10px 0; color: #fff; text-shadow: var(--glow);
        }

        .stat-label { font-size: 12px; color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; grid-column: span 2; }
        .mini-card { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .mini-val { font-family: 'Orbitron'; font-size: 20px; color: var(--accent); display: block; margin-top: 5px; }

        .advice-box { 
            grid-column: span 2; border-left: 3px solid var(--accent); 
            background: rgba(188, 19, 254, 0.05); padding: 15px; font-size: 14px; line-height: 1.5;
        }

        /* Animasyonlar */
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00ff00; margin-right: 8px; animation: pulse 2s infinite; }

    </style>
</head>
<body>

<div class="main-container">
    <div class="glass-panel">
        <div class="header">
            <img src="netcc.png" alt="NET CC">
            <h1>Intelligence Unit</h1>
        </div>

        <div class="input-group">
            <label>Normal Dinleme</label>
            <div class="row">
                <input type="number" id="nA" placeholder="Adet">
                <input type="number" id="nS" placeholder="Ort. Sn">
            </div>
        </div>

        <div class="input-group">
            <label>MMA (Süre / 2)</label>
            <div class="row">
                <input type="number" id="mA" placeholder="Adet">
                <input type="number" id="mS" placeholder="Ort. Sn">
            </div>
        </div>

        <div class="input-group">
            <label>Eğitim & Toplantı (Dakika)</label>
            <input type="number" id="tD" placeholder="Toplam dk">
        </div>

        <button class="btn-calculate" onclick="analyze()">Execute Analysis</button>
    </div>

    <div class="dashboard">
        <div class="card hero">
            <div class="stat-label"><span class="status-dot"></span>System Efficiency</div>
            <div class="val-large" id="resRatio">%0</div>
            <div id="statusLabel" style="color: #444; font-weight: 700;">AWAITING DATA INPUT</div>
        </div>

        <div class="mini-stats">
            <div class="mini-card">
                <div class="stat-label">Active Work</div>
                <span class="mini-val" id="resWork">0 <small style="font-size: 10px;">dk</small></span>
            </div>
            <div class="mini-card">
                <div class="stat-label">Idle / Break</div>
                <span class="mini-val" id="resIdle">0 <small style="font-size: 10px;">dk</small></span>
            </div>
            <div class="mini-card">
                <div class="stat-label">Remaining</div>
                <span class="mini-val" id="resRem">0 <small style="font-size: 10px;">dk</small></span>
            </div>
        </div>

        <div class="card advice-box">
            <div class="stat-label" style="color: var(--accent); margin-bottom: 5px;">Tactical Guidance</div>
            <div id="resAdvice">Analiz motoru hazır. Veri girişi yapıldığında stratejik yönlendirme burada görünecektir.</div>
        </div>

        <div style="grid-column: span 2; text-align: right;">
            <button onclick="copyRep()" style="background: transparent; border: 1px solid var(--border); color: #888; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-family: 'Orbitron'; font-size: 10px;">Export Data</button>
        </div>
    </div>
</div>

<script>
    function analyze() {
        const nA = parseFloat(document.getElementById('nA').value) || 0;
        const nS = parseFloat(document.getElementById('nS').value) || 0;
        const mA = parseFloat(document.getElementById('mA').value) || 0;
        const mS = parseFloat(document.getElementById('mS').value) || 0;
        const tD = parseFloat(document.getElementById('tD').value) || 0;

        const now = new Date();
        const start = new Date(); start.setHours(8, 30, 0);
        const end = new Date(); end.setHours(18, 45, 0);

        let elapsed = Math.floor((now - start) / 1000 / 60);
        if (elapsed < 0) elapsed = 0; if (elapsed > 615) elapsed = 615;

        let remaining = Math.floor((end - now) / 1000 / 60);
        if (remaining < 0) remaining = 0;

        const workTime = (nA * nS) + (nA * 2) + (mA * (mS / 2)) + (tD * 0.7);
        const ratio = (workTime / 540) * 100;
        const idle = elapsed - workTime;

        // Update UI
        const rRatio = document.getElementById('resRatio');
        rRatio.innerText = "%" + ratio.toFixed(1);
        rRatio.style.color = ratio >= 65 ? "#00ff00" : "#ff3b30";
        rRatio.style.textShadow = ratio >= 65 ? "0 0 20px rgba(0,255,0,0.4)" : "0 0 20px rgba(255,59,48,0.4)";

        document.getElementById('resWork').innerHTML = workTime.toFixed(0) + ' <small>dk</small>';
        document.getElementById('resIdle').innerHTML = (idle > 0 ? idle.toFixed(0) : 0) + ' <small>dk</small>';
        document.getElementById('resRem').innerHTML = remaining + ' <small>dk</small>';

        const advice = document.getElementById('resAdvice');
        const statusLabel = document.getElementById('statusLabel');

        if(ratio >= 65) {
            statusLabel.innerText = "TARGET ACHIEVED";
            statusLabel.style.color = "#00ff00";
            advice.innerText = "Performans parametreleri optimize edildi. Mevcut ivmeyi koruyun.";
        } else {
            statusLabel.innerText = "UNDERPERFORMING";
            statusLabel.style.color = "#ff3b30";
            const missing = Math.ceil(((540 * 0.65) - workTime) / (nS + 2 || 8));
            advice.innerText = `Kritik eşik altındasınız. Hedefe ulaşmak için yaklaşık ${missing} adet daha analiz yapılması gerekmektedir.`;
        }
    }

    function copyRep() {
        const ratio = document.getElementById('resRatio').innerText;
        navigator.clipboard.writeText(`NET CC REPORT: Efficiency ${ratio}`);
        alert("Report copied to clipboard.");
    }
</script>

</body>
</html>
