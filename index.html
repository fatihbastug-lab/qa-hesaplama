<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verimlilik Takibi - Kesin Hesap</title>
    <style>
        :root { --primary: #cc0000; --secondary: #2c3e50; --bg: #f4f7f6; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .info-header { text-align: center; margin-bottom: 15px; font-size: 13px; background: #eef2f3; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
        label { font-size: 11px; font-weight: bold; color: var(--primary); display: block; margin-top: 12px; margin-bottom: 4px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; font-size: 14px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 14px; background: var(--secondary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .res-badge { margin-top: 15px; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 20px; display: none; }
        .success { background: #27ae60; color: white; }
        .danger { background: #c0392b; color: white; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; display: none; }
        .stat-item { padding: 12px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; color: white; }
        .analysis-box { margin-top: 12px; padding: 12px; border-radius: 8px; background: #fffde7; border-left: 5px solid #fbc02d; font-size: 13px; line-height: 1.5; display: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-excel { background: #1f7244; color: white; flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-share { background: #3498db; color: white; flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <div class="info-header">
            🕒 Mesai: <b>08:30 - 18:45</b> | Toplam: <b>615 dk</b><br>
            🎯 %65 Hedef Süresi: <b>355 dk</b>
        </div>

        <label>PERSONEL</label>
        <select id="personelSelect"></select>

        <label>NORMAL DİNLEME (İŞLEM)</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="adet" placeholder="Adet">
            <input type="number" id="sure" placeholder="Ort. Süre">
        </div>

        <label>EK İŞLEM (0.5 Katsayı)</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="ekAdet" placeholder="Adet">
            <input type="number" id="ekSure" placeholder="Ort. Süre">
        </div>

        <label>TOPLANTI / EĞİTİM (DK)</label>
        <input type="number" id="toplanti" placeholder="Toplam dk">

        <button class="btn-main" onclick="hesapla()">ANLIK DURUMU ANALİZ ET</button>

        <div id="verimSonuc" class="res-badge"></div>

        <div id="istatistikler" class="stats-grid">
            <div class="stat-item" style="background: #2980b9;" id="uretimDk">0 dk Çalışma</div>
            <div class="stat-item" style="background: #e67e22;" id="molaDk">0 dk Mola</div>
        </div>

        <div id="analizDetay" class="analysis-box"></div>

        <div class="btn-group" id="footerButtons" style="display: none;">
            <button class="btn-excel" onclick="excelIndir()">📊 EXCEL İNDİR</button>
            <button class="btn-share" onclick="paylas()">📤 PAYLAŞ</button>
        </div>
    </div>

<script>
    const isimler = ["DOGA SUMEYYE SAFAK", "OZLEM BASCAVUSOGULLARI", "FATIH KARADENIZ", "HALIDE PALAVAR", "FATIH BASTUG", "HABIBE KARABIYIK", "GOKSU DANACI", "RUKIYE DEMIRKALE", "YALIN BASBUG", "MUNEVVER YILMAZ", "BERFIN SULTAN DAGLI"];
    const sel = document.getElementById('personelSelect');
    isimler.forEach(isim => { let opt = document.createElement('option'); opt.value = isim; opt.innerHTML = isim; sel.appendChild(opt); });

    function hesapla() {
        const simdi = new Date();
        const baslangic = new Date(); baslangic.setHours(8, 30, 0);
        const bitis = new Date(); bitis.setHours(18, 45, 0);
        
        let gecenDk = Math.floor((simdi - baslangic) / 60000);
        gecenDk = Math.max(1, Math.min(gecenDk, 615));
        let kalanDk = Math.max(0, Math.floor((bitis - simdi) / 60000));

        const nA = parseFloat(document.getElementById('adet').value) || 0;
        const nS = parseFloat(document.getElementById('sure').value) || 0;
        const eA = parseFloat(document.getElementById('ekAdet').value) || 0;
        const eS = parseFloat(document.getElementById('ekSure').value) || 0;
        const tDk = parseFloat(document.getElementById('toplanti').value) || 0;

        // Üretim Hesaplama
        const uretim = (nA * nS) + (nA * 2) + (eA * (eS * 0.5)) + (tDk * 0.70);
        
        // Verimlilik Hesabı (%65 = 355 dk baz alınarak)
        const hedefDk = 355; 
        const toplamVerim = ((uretim / hedefDk) * 65).toFixed(1);
        const anlikMola = Math.max(0, gecenDk - uretim);

        // Hedef Analizi
        const kalanHedefDk = Math.max(0, hedefDk - uretim);
        const gerekenAdet = Math.ceil(kalanHedefDk / (nS + 2 || 10));

        // UI
        const vBadge = document.getElementById('verimSonuc');
        vBadge.style.display = 'block';
        vBadge.innerText = `%${toplamVerim} VERİMLİLİK`;
        vBadge.className = toplamVerim >= 65 ? 'res-badge success' : 'res-badge danger';

        document.getElementById('istatistikler').style.display = 'grid';
        document.getElementById('uretimDk').innerText = `${uretim.toFixed(0)} dk Üretilen`;
        document.getElementById('molaDk').innerText = `${anlikMola.toFixed(0)} dk Mola`;
        document.getElementById('footerButtons').style.display = 'flex';

        document.getElementById('analizDetay').style.display = 'block';
        document.getElementById('analizDetay').innerHTML = `
            • Mesai bitimine <b>${kalanDk} dk</b> var.<br>
            • Hedef için gereken ek iş: <b>${kalanHedefDk.toFixed(0)} dk</b>.<br>
            • Kalan sürede yaklaşık <b>${gerekenAdet} adet</b> normal işlem daha yapmalısın.
        `;
    }

    function excelIndir() {
        const isim = document.getElementById('personelSelect').value;
        const verim = document.getElementById('verimSonuc').innerText;
        const table = `<table><tr><th>Personel</th><th>Verim</th></tr><tr><td>${isim}</td><td>${verim}</td></tr></table>`;
        const blob = new Blob(['\ufeff' + table], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${isim}_Rapor.xls`;
        a.click();
    }

    async function paylas() {
        const metin = `📊 Rapor: ${document.getElementById('personelSelect').value}\nVerim: ${document.getElementById('verimSonuc').innerText}\n${document.getElementById('uretimDk').innerText}`;
        if (navigator.share) { await navigator.share({ text: metin }); } 
        else { navigator.clipboard.writeText(metin); alert("Kopyalandı!"); }
    }
</script>
</body>
</html>
